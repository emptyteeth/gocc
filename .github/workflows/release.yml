name: release

on:
  push:
    tags:
      - "v*"
  # A tag push is the real trigger; this lets the workflow be tried without
  # publishing anything, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The desktop app calls GTK 3 through purego at run time and needs no
      # cgo to build, so one Linux runner builds every platform.
      - name: Test
        run: go test ./...

      - name: Build
        run: make dist

      - name: Arrange the archives
        run: |
          set -e
          # The same version make dist used, so the name matches the files.
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          mkdir -p release
          for file in dist/*; do
            base="$(basename "$file")"
            # Remove the version from the name: the archive carries it.
            # "gocc-cli-v1.2.3-linux-amd64" -> "gocc-cli-linux-amd64".
            # The version comes from git describe, so it may be a bare
            # commit or carry -dirty; remove exactly what was used.
            name="${base//-$VERSION-/-}"
            dir="release/${name%.exe}"
            mkdir -p "$dir"
            cp "$file" "$dir/$name"
            if [ "${name##*.}" = "exe" ]; then
              (cd release && zip -q "${name%.exe}.zip" "${name%.exe}/$name")
              rm -rf "$dir"
            else
              (cd release && tar -czf "${name}.tar.gz" "${name}")
              rm -rf "$dir"
            fi
          done
          ls -l release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
