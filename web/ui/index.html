<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<title>gocc</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-hover: #e9ebef;
    --border: #d8dbe0;
    --text: #16181d;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --danger: #b91c1c;
    --radius: 8px;
    --gap: 8px;
    --pad: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #22252c;
      --surface-hover: #2c3038;
      --border: #3a3f49;
      --text: #e8eaee;
      --muted: #9aa2af;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    flex: none;
  }
  header h1 { font-size: 15px; margin: 0; }
  header .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  header .status.error { color: var(--danger); }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-rows: 1fr 2fr;
  }
  .row { min-height: 0; display: grid; }
  #top { grid-template-columns: 1fr 2fr; }
  #bottom { border-top: 1px solid var(--border); }

  .pane { padding: var(--pad); min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 0;
  }
  .row-between { display: flex; align-items: center; gap: 6px; }
  .row-between h2 { flex: 1; }

  button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 10px; cursor: pointer;
    min-height: 32px;
  }
  button:hover:not(:disabled) { background: var(--surface-hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }

  input, select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 8px; width: 100%; min-width: 0; min-height: 32px;
  }

  ul.list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; }
  ul.list li {
    padding: 6px 8px; border-radius: var(--radius); cursor: default;
    display: flex; flex-direction: column; gap: 2px;
  }
  ul.list li + li { margin-top: 2px; }
  ul.list li:hover { background: var(--surface-hover); }
  ul.list li.chosen { background: var(--accent); color: var(--accent-text); }
  ul.list li .top { display: flex; align-items: center; gap: 6px; }
  ul.list li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.list li .play {
    flex: none; margin-left: auto; padding: 2px 8px; font-size: 12px;
    line-height: 1.4; border-radius: 6px;
  }
  ul.list li.chosen .play { color: var(--accent-text); border-color: var(--accent-text); background: transparent; }
  ul.list li.chosen .play:hover { background: rgba(255,255,255,.18); }
  .loading { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .loading .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .loading .dot { animation: none; opacity: .8; } }
  ul.list li .sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.list li.chosen .sub { color: var(--accent-text); opacity: .85; }
  .empty { color: var(--muted); font-size: 12px; padding: 8px; }

  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .card .state { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .track { font-size: 13px; }
  .card .url { font-size: 11px; color: var(--muted); word-break: break-all; }
  .badge {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    background: var(--surface-hover); color: var(--muted);
  }

  .transport { display: flex; gap: 8px; flex-wrap: wrap; }
  .transport button { min-width: 88px; }

  .volume { display: flex; align-items: center; gap: 10px; }
  .volume input[type=range] { flex: 1; padding: 0; min-height: 24px; }
  .volume .pct { width: 42px; text-align: right; color: var(--muted); font-size: 12px; }
  label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  label.check input { width: auto; min-height: 0; }

  form.add {
    background: var(--surface); border-radius: var(--radius);
    padding: 8px; display: flex; align-items: center; gap: 6px;
  }
  form.add #add-name { flex: 0 0 110px; }
  form.add #add-url { flex: 1 1 auto; }
  form.add button { flex: none; }

  .error {
    border-radius: var(--radius); padding: 8px; background: var(--surface);
    font-size: 12px;
  }
  .error b { color: var(--danger); display: block; }
  .error span { color: var(--muted); word-break: break-word; }
  .spinner { color: var(--muted); font-size: 12px; }

  /* The top bar of the bottom row: the tabs and the one search field. */
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .segmented { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); flex: none; }
  .segmented button { border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; min-height: 28px; }
  .segmented button.on { background: var(--bg); box-shadow: 0 0 0 1px var(--border); font-weight: 600; }
  .search { flex: 1; min-width: 160px; display: flex; }
  .search input { padding-left: 30px; }
  .search-wrap { position: relative; flex: 1; display: flex; }
  .search-wrap::before {
    content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; font-size: 16px;
  }

  /* The catalogue's own row: country, order, refresh. */
  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filters select { flex: 1 1 200px; max-width: 320px; }
  .filters .segmented { flex: none; }

  /* Station cards: a square picture with the text over its bottom. */
  .grid { overflow: auto; flex: 1; min-height: 0; display: grid; gap: 8px;
    align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    /* Each row takes the height of the square it holds. Chrome gives a
       grid inside a height-constrained flex item rows of the wrong
       height with `auto`, and the gap between them collapses. */
    grid-auto-rows: min-content; }
  .station {
    position: relative; border-radius: 8px; overflow: hidden;
    background: var(--surface-hover); cursor: default;
    /* align-self keeps the grid from stretching the item to a row height
       of its own, which would let the row and the card size each other
       into a wrong height. */
    align-self: start;
  }
  /* The square comes from a block in the card's normal flow: its
     padding-top is a share of the card's width, and it is what gives the
     grid row its height. A grid item's own aspect-ratio or percentage
     padding is not counted the same way by every browser; a block
     child's is. The card's contents are drawn over it. */
  .station::before { content: ""; display: block; padding-top: 100%; }
  .station > * { position: absolute; }
  .station img { inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .station .initials { inset: 0; display: grid; place-items: center;
    font-size: 30px; font-weight: 600; color: var(--muted); }
  .station .shade {
    inset: auto 0 0 0; height: 60px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.88));
    pointer-events: none;
  }
  .station .meta {
    inset: auto 8px 6px 8px; color: #fff;
    display: flex; flex-direction: column; gap: 1px;
  }
  .station .meta .title { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .station .meta .detail { font-size: 10px; color: rgba(255,255,255,.78);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .station .actions {
    top: 6px; right: 6px; display: flex; gap: 4px;
    opacity: 0; transition: opacity .12s ease;
  }
  .station:hover .actions, .station:focus-within .actions { opacity: 1; }
  .iconbtn {
    width: 28px; height: 28px; min-height: 28px; padding: 0; border: 0; border-radius: 14px;
    background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center;
    font-size: 13px; line-height: 1;
  }
  .iconbtn:hover:not(:disabled) { background: rgba(0,0,0,.75); }
  .station.playing .meta .title::before { content: "▶ "; font-size: 10px; }

  /* A phone: one column, each part taking the room it needs. */
  @media (max-width: 720px) {
    body { overflow: auto; }
    main { display: block; }
    #top, #bottom { display: block; }
    #top .pane + .pane, #bottom { border-left: 0; }
    #top .pane + .pane { border-top: 1px solid var(--border); }
    .pane { padding: 10px; }
    ul.list { max-height: 40vh; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .filters select { max-width: none; flex: 1 1 100%; }
    .toolbar { gap: 8px; }
    .search { min-width: 100%; order: 3; }
    /* The URL needs a row of its own on a phone, under the name and the
       button. */
    form.add { flex-wrap: wrap; }
    /* The name and the button share the first line; the URL takes the
       next. The name may shrink so that the button fits beside it. */
    form.add #add-name { flex: 1 1 120px; min-width: 0; order: 1; }
    form.add button   { order: 2; }
    form.add #add-url { flex: 1 1 100%; order: 3; }
  }
</style>
</head>
<body>
<header>
  <h1>gocc</h1>
  <span id="header-status" class="status"></span>
</header>

<main>
  <div class="row" id="top">
    <section class="pane" aria-label="Devices">
      <div class="row-between">
        <h2>Devices</h2>
        <button id="scan" title="Look for devices again">Scan</button>
      </div>
      <ul class="list" id="devices"></ul>
    </section>

    <section class="pane" aria-label="Device">
      <div id="control"></div>
    </section>
  </div>

  <div class="row" id="bottom">
    <section class="pane" aria-label="Favorites and stations">
      <div class="toolbar">
        <div class="segmented" id="tabs" role="tablist">
          <button id="tab-favorites" role="tab" aria-selected="true">Favorites</button>
          <button id="tab-browse" role="tab" aria-selected="false">Browse</button>
        </div>
        <div class="search">
          <div class="search-wrap"><input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search"></div>
        </div>
      </div>

      <div class="filters" id="filters">
        <select id="country" aria-label="Country"></select>
        <div class="segmented" id="orders" role="group" aria-label="Order"></div>
        <button id="refresh-catalogue" title="Read the catalogue again">Refresh</button>
      </div>

      <ul class="list" id="favorites"></ul>
      <div class="grid" id="stations"></div>

      <form class="add" id="add">
        <input id="add-name" placeholder="Name" autocomplete="off">
        <input id="add-url" placeholder="http://radio.example/stream.mp3" autocomplete="off">
        <button class="primary" type="submit">Add</button>
      </form>
    </section>
  </div>
</main>

<script>
"use strict";

let state = null;
let pane = "favorites";     // "favorites" or "browse"
let search = "";
let queryTimer = null;

const $ = (id) => document.getElementById(id);

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body === undefined ? {} : { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    let message = res.status + " " + res.statusText;
    try { message = (await res.json()).error || message; } catch (_) {}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}

let lastError = "";

function act(fn) {
  return async (event) => {
    try { await fn(event); } catch (err) {
      lastError = err && err.message ? err.message : String(err);
      render();
    }
  };
}

function render() {
  if (!state) return;
  renderHeader();
  renderDevices();
  renderControl();
  renderTabs();
  renderFavorites();
  renderBrowse();
}

// --- header --------------------------------------------------------------

function renderHeader() {
  const el = $("header-status");
  if (lastError || state.error) {
    el.textContent = lastError || state.error;
    el.className = "status error";
  } else {
    const n = state.devices.length;
    el.textContent = n === 1 ? "1 device found" : n + " devices found";
    el.className = "status";
  }
}

// --- devices -------------------------------------------------------------

function renderDevices() {
  const list = $("devices");
  if (state.devices.length === 0) {
    replace(list, [el("li", { class: "empty" }, "Looking for devices…")]);
    return;
  }
  replace(list, state.devices.map((d) => {
    const li = el("li", { class: d.connected ? "chosen" : "" });
    li.append(
      el("span", { class: "name" }, (d.connected ? "● " : "") + d.name),
      el("span", { class: "sub" }, d.addr),
    );
    li.onclick = act(() => api("POST", "/api/choose", { uuid: d.uuid }));
    return li;
  }));
}

// --- the chosen device ---------------------------------------------------

function renderControl() {
  const box = $("control");
  const nodes = [];

  if (lastError) {
    nodes.push(el("div", { class: "error" }, [
      el("b", {}, "Last error"), el("span", {}, lastError),
    ]));
  }
  if (!state.selected) {
    nodes.push(el("div", { class: "card" }, [
      el("div", { class: "state" }, "No device selected"),
      el("div", { class: "url" }, "Choose a device above to control it."),
    ]));
    replace(box, nodes);
    return;
  }

  const device = state.devices.find((d) => d.uuid === state.selected);
  nodes.push(el("div", { class: "row-between" }, [
    el("div", {}, [
      el("div", { class: "track" }, device ? device.name : "Unknown device"),
      el("div", { class: "url" }, device ? device.addr : ""),
    ]),
    button("Disconnect", () => api("POST", "/api/disconnect")),
  ]));

  if (state.connecting) {
    nodes.push(el("div", { class: "spinner" }, "Connecting…"));
    replace(box, nodes);
    return;
  }

  const card = el("div", { class: "card" }, [
    el("div", { class: "state" }, [
      state.description,
      state.muted ? el("span", { class: "badge" }, "Muted") : null,
    ]),
  ]);
  const track = [state.artist, state.title].filter(Boolean).join(" — ");
  if (track) card.append(el("div", { class: "track" }, track));
  if (state.url) card.append(el("div", { class: "url" }, state.url));
  if (state.idle && !state.loading) {
    card.append(el("div", { class: "url" }, "Nothing is playing. Pick a station below."));
  }
  nodes.push(card);

  nodes.push(el("div", { class: "transport" }, [
    button(state.playing ? "Pause" : "Play", () => api("POST", "/api/toggle"), "primary"),
    disabled(button("Stop", () => api("POST", "/api/stop")), state.idle),
    button("Refresh", () => api("POST", "/api/refresh")),
  ]));
  if (state.loading) {
    nodes.push(el("div", { class: "loading" }, [
      el("span", { class: "dot" }), state.loadingReason || "Starting…",
    ]));
  }

  if (!volume.range.dragging) {
    volume.range.value = String(state.volume);
    volume.pct.textContent = Math.round(state.volume * 100) + "%";
  }
  volume.mute.checked = state.muted;
  nodes.push(el("div", { class: "volume" }, [volume.range, volume.pct]));
  nodes.push(el("label", { class: "check" }, [volume.mute, "Mute"]));

  replace(box, nodes);
}

// --- tabs and search -----------------------------------------------------

function renderTabs() {
  $("tab-favorites").className = pane === "favorites" ? "on" : "";
  $("tab-browse").className = pane === "browse" ? "on" : "";
  $("tab-favorites").setAttribute("aria-selected", pane === "favorites");
  $("tab-browse").setAttribute("aria-selected", pane === "browse");
  $("search").placeholder = pane === "favorites" ? "Search favorites" : "Search stations";
  $("filters").style.display = pane === "browse" ? "" : "none";
}

// --- favorites -----------------------------------------------------------

function renderFavorites() {
  const list = $("favorites");
  list.style.display = pane === "favorites" ? "" : "none";
  if (pane !== "favorites") return;

  const word = search.trim().toLowerCase();
  const shown = word === "" ? state.favorites : state.favorites.filter((e) =>
    e.name.toLowerCase().includes(word) || e.url.toLowerCase().includes(word));

  if (state.favorites.length === 0) {
    replace(list, [el("li", { class: "empty" },
      "No favorites yet. Save a station from Browse, or add a URL below.")]);
    return;
  }
  if (shown.length === 0) {
    replace(list, [el("li", { class: "empty" }, "No favorites match the search.")]);
    return;
  }
  replace(list, shown.map((entry) => {
    const li = el("li", { class: entry.playing ? "chosen" : "" });
    const play = el("button", { class: "play", type: "button", title: "Play " + entry.name }, "Play");
    play.onclick = (event) => {
      event.stopPropagation();
      act(() => api("POST", "/api/play", { url: entry.url }))();
    };
    const remove = el("button", { class: "play", type: "button", title: "Remove " + entry.name }, "✕");
    remove.onclick = (event) => {
      event.stopPropagation();
      act(() => api("DELETE", "/api/favorites", { url: entry.url }))();
    };
    li.append(
      el("span", { class: "top" }, [
        el("span", { class: "name" }, (entry.playing ? "▶ " : "") + entry.name),
        play,
        remove,
      ]),
      el("span", { class: "sub" }, entry.url),
    );
    return li;
  }));
}

// --- the catalogue -------------------------------------------------------

function renderBrowse() {
  const grid = $("stations");
  grid.style.display = pane === "browse" ? "" : "none";
  const add = $("add");
  add.style.display = pane === "favorites" ? "" : "none";
  if (pane !== "browse") return;

  renderFilters();

  if (state.searching) {
    grid.replaceChildren(el("div", { class: "empty" }, "Reading the catalogue…"));
    return;
  }
  if (state.searchError) {
    grid.replaceChildren(el("div", { class: "error" }, [
      el("b", {}, "The catalogue could not be read"),
      el("span", {}, state.searchError),
    ]));
    return;
  }
  if (state.stations.length === 0) {
    grid.replaceChildren(el("div", { class: "empty" },
      "No stations. Try another country, or clear the search."));
    return;
  }

  const word = search.trim().toLowerCase();
  const shown = word === "" ? state.stations : state.stations.filter((s) =>
    s.name.toLowerCase().includes(word));

  replace(grid, shown.map((station) => stationCard(station)));
}

function renderFilters() {
  const country = $("country");
  // Rebuild only when the country list itself changed, so that an open
  // dropdown is not closed under the user's finger on every state push.
  if (country.dataset.count !== String(state.countries.length)) {
    country.dataset.count = String(state.countries.length);
    country.replaceChildren(...state.countries.map((c) =>
      el("option", { value: c.code }, c.name + " (" + c.stations + ")")));
  }
  country.value = state.countryCode;

  const orders = $("orders");
  const wanted = [["votes", "Votes"], ["clickcount", "Popular"], ["name", "Name"]];
  if (orders.children.length !== wanted.length) {
    orders.replaceChildren(...wanted.map(([key, label]) => {
      const b = el("button", { type: "button", "data-order": key }, label);
      b.onclick = act(() => api("POST", "/api/catalogue/order", { order: key }));
      return b;
    }));
  }
  for (const b of orders.children) {
    b.className = b.dataset.order === state.order ? "on" : "";
  }
}

function stationCard(station) {
  const card = el("div", { class: "station" + (station.playing ? " playing" : "") });
  card.title = station.name;

  const placeholder = el("span", { class: "initials" }, initials(station.name));
  if (station.favicon) {
    const img = el("img", { loading: "lazy", decoding: "async", alt: "" });
    // The picture arrives as the card shows: the initials give way to it,
    // and stay when it fails.
    img.onload = () => placeholder.remove();
    img.onerror = () => img.remove();
    img.src = station.favicon;
    card.append(img);
  }
  card.append(placeholder);
  card.append(el("div", { class: "shade" }));

  const actions = el("div", { class: "actions" }, [
    iconAction("▶", "Play " + station.name, () => api("POST", "/api/catalogue/" + indexOf(station) + "/play")),
    iconAction(station.saved ? "♥" : "♡", (station.saved ? "Saved " : "Save ") + station.name,
      () => api("POST", "/api/catalogue/" + indexOf(station) + "/favorite", { saved: !station.saved })),
  ]);
  card.append(actions);

  card.append(el("div", { class: "meta" }, [
    el("span", { class: "title" }, station.name),
    el("span", { class: "detail" }, detailOf(station)),
  ]));
  // A double click, or Enter on a focused card, plays it.
  card.tabIndex = 0;
  card.ondblclick = act(() => api("POST", "/api/catalogue/" + indexOf(station) + "/play"));
  card.onkeydown = (event) => {
    if (event.key === "Enter") act(() => api("POST", "/api/catalogue/" + indexOf(station) + "/play"))();
  };
  return card;
}

function indexOf(station) {
  return state.stations.findIndex((s) => s.uuid === station.uuid);
}

function detailOf(station) {
  const parts = [];
  if (station.countryCode) parts.push(station.countryCode);
  if (station.codec && station.codec.toUpperCase() !== "UNKNOWN") parts.push(station.codec);
  if (station.bitrate > 0) parts.push(station.bitrate + " kbps");
  if (station.hls) parts.push("HLS");
  return parts.length ? parts.join(" · ") : "Radio";
}

function initials(name) {
  const words = name.trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return "?";
  if (words.length === 1) return words[0][0].toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}

function iconAction(glyph, tooltip, fn) {
  const b = el("button", { class: "iconbtn", type: "button", title: tooltip, "aria-label": tooltip }, glyph);
  b.onclick = (event) => { event.stopPropagation(); act(fn)(); };
  return b;
}

// --- small helpers -------------------------------------------------------

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined) continue;
    if (key === "class") node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of [].concat(children || [])) {
    if (child === null || child === undefined) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
}

// replace swaps the children of a container, keeping any among them the
// new ones reuse, which keeps a scrolled list and a dragged slider steady.
function replace(container, nodes) {
  for (const node of nodes) container.append(node);
  const keep = new Set(nodes);
  for (const child of Array.from(container.childNodes)) {
    if (!keep.has(child)) child.remove();
  }
}

function button(label, fn, cls) {
  const b = el("button", { class: cls || "", type: "button" }, label);
  b.onclick = act(fn);
  return b;
}

function disabled(node, yes) {
  node.disabled = yes;
  return node;
}

// --- the controls that live across renders -------------------------------

function buildVolume() {
  const range = el("input", { type: "range", min: "0", max: "1", step: "0.01", value: "0", "aria-label": "Volume" });
  const pct = el("span", { class: "pct" }, "0%");
  range.onpointerdown = () => { range.dragging = true; };
  range.onpointerup = () => { range.dragging = false; };
  range.oninput = () => {
    range.dragging = true;
    pct.textContent = Math.round(range.value * 100) + "%";
  };
  range.onchange = act(() => {
    range.dragging = false;
    return api("POST", "/api/volume", { level: Number(range.value) });
  });
  const mute = el("input", { type: "checkbox" });
  mute.onchange = act(() => api("POST", "/api/mute", { muted: mute.checked }));
  return { range, pct, mute };
}

const volume = buildVolume();

// --- wiring --------------------------------------------------------------

$("scan").onclick = act(() => api("POST", "/api/scan"));
$("tab-favorites").onclick = () => { pane = "favorites"; render(); };
$("tab-browse").onclick = () => { pane = "browse"; search = ""; $("search").value = ""; render(); };

$("search").oninput = (event) => {
  search = event.target.value;
  render();
  // The catalogue is asked only once the typing pauses; the favorites are
  // filtered as it is typed, with no request at all.
  if (pane !== "browse") return;
  clearTimeout(queryTimer);
  queryTimer = setTimeout(() => {
    act(() => api("POST", "/api/catalogue/query", { query: search.trim() }))();
  }, 300);
};

$("country").onchange = act((event) =>
  api("POST", "/api/catalogue/country", { code: event.target.value }));

$("refresh-catalogue").onclick = act(() => api("POST", "/api/catalogue/refresh"));

$("add").onsubmit = act(async (event) => {
  event.preventDefault();
  await api("POST", "/api/favorites", {
    name: $("add-name").value,
    url: $("add-url").value,
  });
  $("add-name").value = "";
  $("add-url").value = "";
  $("add-name").focus();
});

// The state arrives as it changes, so the page never polls.
let events = null;
function connect() {
  events = new EventSource("/api/events");
  events.onmessage = (e) => {
    state = JSON.parse(e.data);
    lastError = "";
    render();
  };
  events.onerror = () => {
    const el = $("header-status");
    el.textContent = "Disconnected from the server, reconnecting…";
    el.className = "status error";
  };
}
// A phone that went to the background may come back with a dead stream.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (events && events.readyState === EventSource.CLOSED) {
    connect();
  }
});
connect();

// The country list is read when the page first shows the catalogue.
act(() => api("POST", "/api/catalogue/countries"))();
</script>
</body>
